<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wave Merge Test</title>
  <style>
    :root {
      --primary: #b45309;
      --primary-hover: #92400e;
      --on-primary: #fffbeb;
      --background: #faf7f2;
      --surface: #fffdf9;
      --surface-variant: #f3ede3;
      --text: #1c1917;
      --text-muted: #78716c;
      --outline: #e7dfd2;
      --outline-strong: #d6cbb9;
      --accent: #0f766e;
      --accent-tint: #e6f4f1;
      --focus-ring: rgba(180, 83, 9, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    }

    main {
      width: 100%;
      max-width: 32rem;
      padding: 2rem;
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: 0.75rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 2rem;
      color: var(--primary);
    }

    p {
      margin: 0 0 1rem;
      color: var(--text-muted);
    }

    .placeholder {
      padding: 1rem;
      background: var(--surface-variant);
      border-radius: 0.5rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Wave Merge Test</h1>
    <p>This is a placeholder page. The counter and health note arrive in a later task.</p>
    <div class="placeholder">Placeholder</div>
  </main>
</body>
</html>
